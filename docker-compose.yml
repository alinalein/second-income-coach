services:
  postgres:
    # Story 5.3b (AD-2): pgvector pre-installed, same major version (17) as
    # before — `PostgresStore.setup()` runs `CREATE EXTENSION vector` at
    # startup, which needs the extension's shared library present in the
    # image; plain postgres:17-alpine doesn't ship it.
    image: pgvector/pgvector:pg17
    container_name: second-income-coach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-second_income_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-second_income_coach}
      POSTGRES_DB: ${POSTGRES_DB:-second_income_coach}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-second_income_coach}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
